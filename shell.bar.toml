# Faded Relay — a thinner bar than the default; the frame should stay a line,
# not a shelf.

[bar]
background       = "#0F0D0E"
background-alpha = 1.0
text             = "#DCD4C3"
# Modules calling attention to themselves (recording, voxtype, alerts, updates)
active           = "#C05E45"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 26
